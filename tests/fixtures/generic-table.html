<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Home game</title>
<style>
  body { margin: 0; background: #1d2b3a; color: #fff; font-family: sans-serif; width: 1280px; height: 800px; position: relative; }
  header.stakes { padding: 8px; }
  .felt { position: absolute; left: 200px; top: 120px; width: 880px; height: 460px; border-radius: 230px; background: #22543d; }
  .seat { position: absolute; width: 140px; background: #0008; border-radius: 8px; padding: 6px; text-align: center; }
  .seat img, .community-cards img { width: 40px; height: 56px; }
  .s0 { left: 570px; top: 610px; } .s1 { left: 120px; top: 300px; } .s2 { left: 570px; top: 20px; } .s3 { left: 1030px; top: 300px; }
  .community-cards { position: absolute; left: 520px; top: 330px; }
  .pot { position: absolute; left: 600px; top: 290px; }
  .dealer-button { position: absolute; width: 20px; height: 20px; border-radius: 10px; background: #fff; color: #000; text-align: center; }
  .controls { position: absolute; left: 400px; top: 740px; }
  .controls div[role=button] { display: inline-block; padding: 10px 20px; margin: 0 6px; background: #ddd; color: #000; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<header class="stakes">NL Hold'em · Blinds 5/10</header>
<div class="felt"><div class="pot">Pot: 0</div><div class="community-cards"></div></div>
<div id="seats"></div>
<div class="dealer-button">D</div>
<div class="controls"></div>
<script>
  const POS = [[640, 590], [300, 360], [640, 120], [1000, 360]];
  window.G = {
    render(s) {
      document.getElementById('seats').innerHTML = s.players.map((p, i) =>
        '<div class="seat s' + i + (p.me ? ' me' : '') + '"><div class="name">' + p.name + '</div><div class="chips">' + p.stack + '</div>' +
        (p.cards ? p.cards.map((c) => '<img src="/cards/' + c.toUpperCase() + '.svg">').join('') : '') +
        (p.bet ? '<div class="bet-amount">' + p.bet + '</div>' : '') + '</div>').join('');
      document.querySelector('.community-cards').innerHTML = (s.board || []).map((c) => '<img src="/cards/' + c.toUpperCase() + '.svg">').join('');
      document.querySelector('.pot').textContent = 'Pot: ' + (s.pot || 0);
      const d = POS[s.dealer];
      Object.assign(document.querySelector('.dealer-button').style, { left: d[0] + 'px', top: d[1] + 'px' });
      document.querySelector('.controls').innerHTML = (s.buttons || []).map((b) => '<div role="button">' + b + '</div>').join('');
    }
  };
</script>
</body>
</html>
