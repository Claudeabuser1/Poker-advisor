<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../ui/pages.css">
  <style>
    body { width: 320px; padding: 12px 14px; }
    .top { display: flex; align-items: center; justify-content: space-between; }
    #siteBox { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="top"><h1>&spades; Poker <b>Advisor</b></h1><input type="checkbox" id="enabled" title="Enable / disable"></div>

  <div id="siteBox" class="card"></div>

  <h2>Mode</h2>
  <div class="seg" id="mode"><button data-v="advice">Advice + highlight</button><button data-v="hud">HUD only</button></div>

  <h2>Strategy</h2>
  <label>Style <select id="style"><option value="tight">Tight</option><option value="balanced">Balanced</option><option value="aggressive">Aggressive</option></select></label>
  <label><span>Bluffing <small id="bluffV"></small></span><input type="range" id="bluff" min="0" max="100" step="5"></label>
  <label><span>Stack protection <small id="safetyV"></small></span><input type="range" id="safety" min="0" max="100" step="5"></label>

  <h2>Table</h2>
  <label><span>Big blind <small>0 = detect automatically</small></span><input type="number" id="bigBlindOverride" min="0" step="any" style="width:80px"></label>
  <label><span>Your player name <small>helps find your seat</small></span><input type="text" id="heroName" style="width:120px"></label>

  <div class="row" style="margin-top:12px"><button id="opts" class="sec">Players, notes &amp; settings</button></div>

  <script src="../storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
